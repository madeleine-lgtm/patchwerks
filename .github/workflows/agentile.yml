name: Agentile
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Coordination verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Select trusted baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE" ]]; then
            baseline="$PR_BASE"
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            baseline="$PUSH_BEFORE"
          else
            baseline="$(git rev-parse HEAD)"
          fi
          git cat-file -e "$baseline^{commit}"
          echo "AGENTILE_BASELINE_REF=$baseline" >> "$GITHUB_ENV"
      - name: Verify configuration and ratchets
        run: bash scripts/verify.sh
